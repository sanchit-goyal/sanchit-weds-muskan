<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanchit &amp; Muskan</title>
<script>
// Live site = Violet design at /S/, /A/, /N/ (home -> /N/). Short links: /s, /family, /friends ... -> /S/, /A/, /N/.
// Archive friendly links: /archive/<design>/family etc. Any other unknown or old design link (e.g. /royal/A) -> home page.
(function () {
  var r = location.pathname.match(/^\/([A-Za-z]+)\/?$/);
  var map0 = { s: 'S', all: 'S', a: 'A', family: 'A', n: 'N', friends: 'N', guests: 'N', guest: 'N' };
  if (r && map0[r[1].toLowerCase()]) { location.replace('/' + map0[r[1].toLowerCase()] + '/' + location.search); return; }
  var m = location.pathname.match(/^\/((?:archive\/)?[a-z0-9-]+)\/([A-Za-z]+)\/?$/);
  var map = { s: 'S', all: 'S', a: 'A', family: 'A', n: 'N', friends: 'N', guests: 'N', guest: 'N' };
  var live = m && m[1].indexOf('archive/') === 0;
  if (live && map[m[2].toLowerCase()] && m[2] !== map[m[2].toLowerCase()]) { location.replace('/' + m[1] + '/' + map[m[2].toLowerCase()] + '/' + location.search); return; }
  location.replace('/');
})();
</script></head><body style="background:#16120d"></body></html>
