<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanchit &amp; Muskan</title>
<script>
// Live site = Violet only. Friendly links: /violet/s, /violet/all, /violet/family, /violet/friends ... -> /violet/S/, /violet/A/, /violet/N/
// (also /archive/<design>/family etc.). Any other unknown or old design link (e.g. /royal/A) -> home page.
(function () {
  var m = location.pathname.match(/^\/((?:archive\/)?[a-z0-9-]+)\/([A-Za-z]+)\/?$/);
  var map = { s: 'S', all: 'S', a: 'A', family: 'A', n: 'N', friends: 'N', guests: 'N', guest: 'N' };
  var live = m && (m[1] === 'violet' || m[1].indexOf('archive/') === 0);
  if (live && map[m[2].toLowerCase()] && m[2] !== map[m[2].toLowerCase()]) { location.replace('/' + m[1] + '/' + map[m[2].toLowerCase()] + '/' + location.search); return; }
  location.replace('/');
})();
</script></head><body style="background:#16120d"></body></html>
